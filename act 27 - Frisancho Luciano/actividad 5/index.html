<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio 5</title>
    <script src="./src/script.js" defer></script>
</head>
<body>
    <form>
        <h2>Presupuesto de Equipo de Computación</h2>

        <p>
            <label for="procesador">Procesador:</label><br>
            <select id="procesador">
                <option value="400">Intel I3 - $400</option>
                <option value="600">Intel I5 - $600</option>
                <option value="800">Intel I7 - $800</option>
            </select>
        </p>

        <p>
            <label for="monitor">Monitor:</label><br>
            <select id="monitor">
                <option value="250">Samsung 20' - $250</option>
                <option value="350">Samsung 22' - $350</option>
                <option value="550">Samsung 26' - $550</option>
            </select>
        </p>

        <p>
            <label for="disco">Disco Duro:</label><br>
            <select id="disco">
                <option value="300">500 Gb - $300</option>
                <option value="440">1 Tb - $440</option>
                <option value="500">3 Tb - $500</option>
            </select>
        </p>

        <p>
            <input type="button" value="Calcular" onclick="calcularPresupuesto()">
        </p>

        <p>
            Total Presupuesto: <input type="text" id="total" readonly>
        </p>
    </form>
</body>
</html>
